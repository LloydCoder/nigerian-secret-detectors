name: CI

on:
  push:
    branches: [main, agent/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest build twine
      - run: python -m pytest -q
      - name: Build package and validate metadata
        run: |
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
              text = archive.read(metadata).decode()
          assert 'License-Expression: Apache-2.0' in text
          PY
      - run: python -m nigerian_secrets.cli . --format json --fail-on none > /tmp/scan.json
      - name: Container build
        if: matrix.python-version == '3.13'
        run: docker build --tag nigerian-secret-detectors:ci .
      - name: Container smoke test
        if: matrix.python-version == '3.13'
        run: docker run --rm --read-only --cap-drop=ALL nigerian-secret-detectors:ci . --format json --fail-on none
