name: Release Security

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate SBOM
        run: python scripts/generate_sbom.py
      - name: Checksums
        run: sha256sum dist/* sbom.spdx.json > SHA256SUMS
      - name: Attest distribution
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            sbom.spdx.json
            SHA256SUMS
