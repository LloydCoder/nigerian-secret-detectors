name: Security Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q nigerian_secrets
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict
      - name: Scan native source
        run: nigerian-scan nigerian_secrets --format sarif --fail-on high > nigerian-secret-results.sarif
      - name: Validate SARIF structure
        run: python -c 'import json; p=json.load(open("nigerian-secret-results.sarif")); assert p["version"] == "2.1.0" and p["runs"]'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: nigerian-secret-results.sarif
