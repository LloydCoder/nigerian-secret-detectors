name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q nigerian_secrets
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict -r requirements-audit.txt
      - name: Prepare operational source scan target
        run: |
          rm -rf /tmp/nigerian-secret-scan
          mkdir -p /tmp/nigerian-secret-scan
          find nigerian_secrets -type f -name '*.py' ! -name 'rules.py' ! -name 'registry.py' ! -name 'benchmark.py' -exec cp --parents '{}' /tmp/nigerian-secret-scan/ \;
      - name: Scan operational source
        run: nigerian-scan /tmp/nigerian-secret-scan --format sarif --fail-on high > nigerian-secret-results.sarif
      - name: Validate SARIF structure
        run: python -c 'import json; p=json.load(open("nigerian-secret-results.sarif")); assert p["version"] == "2.1.0" and p["runs"]'
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: nigerian-secret-results.sarif
